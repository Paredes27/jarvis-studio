<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Authorization received · Jarvis Studio</title>
<link rel="stylesheet" href="/jarvis-studio/style.css">
</head>
<body>
<main>
<h1>Authorization received</h1>
<p>Copy the full address below and paste it into the terminal where <code>nexus conteudo ligar</code> is waiting.</p>
<p class="dim">Nothing on this page is sent anywhere. The code stays in your browser until you paste it.</p>
<textarea id="url" class="box" readonly aria-label="Full address"></textarea>
<button id="copy" type="button">Copy</button>
<p class="dim" id="status" role="status"></p>
</main>
<script>
  // Shows the current address (with ?code=…&state=…) so it can be copied. No network requests.
  var box = document.getElementById("url");
  box.value = window.location.href;
  document.getElementById("copy").addEventListener("click", function () {
    box.select();
    var done = function () { document.getElementById("status").textContent = "Copied."; };
    if (navigator.clipboard) { navigator.clipboard.writeText(box.value).then(done, function () { document.execCommand("copy"); done(); }); }
    else { document.execCommand("copy"); done(); }
  });
</script>
</body>
</html>
